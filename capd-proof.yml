name: SI3BP rigorous CAPD certificate

on:
  workflow_dispatch:
  push:
    paths:
      - 'si3bp_capd.cpp'
      - 'Makefile'
      - '.github/workflows/capd-proof.yml'

jobs:
  rigorous-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout certificate repository
        uses: actions/checkout@v4

      - name: Exact rational prechecks
        run: python3 analytic_prechecks.py

      - name: Apply one-return reversibility patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("si3bp_capd.cpp")
          text = path.read_text(encoding="utf-8")

          marker = "// Hyperbolicity of the symmetric period-four point without a four-return"
          start = text.index(marker)
          sig = "IMatrix evalDF4BySymmetry(IPoincareMap& pmPeri,"
          func = text.index(sig, start)
          brace = text.index("{", func)

          depth = 0
          end = None
          for i in range(brace, len(text)):
              ch = text[i]
              if ch == "{":
                  depth += 1
              elif ch == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break

          if end is None:
              raise RuntimeError("could not locate end of evalDF4BySymmetry")

          replacement = r'''// Hyperbolicity from one C^1 return and exact reversibility.
          //
          // We first refine the already certified root bracket. A cell can be
          // discarded rigorously whenever the enclosure of g(p)=pi_{p_z}P(p,0)
          // does not contain zero. Only cells that may contain the exact root
          // are kept. This avoids accepting an enormous C^1 enclosure merely
          // because CAPD did not throw an exception on the full root bracket.
          bool refineRootC1(IPoincareMap& pmPeri,
                            const interval& I,
                            int depth,
                            MapEval& out)
          {
            MapEval E=evalP1Adaptive(pmPeri,I,ZERO);
            if(!containsZero(E.image[PZ])) return false;
            if(depth<=0 || hi(I)-lo(I) < 1e-13){
              out=E;
              return true;
            }

            const double L=lo(I), U=hi(I), M=0.5*(L+U);
            if(!(L<M && M<U)){
              out=E;
              return true;
            }

            MapEval A,B;
            const bool hasA=refineRootC1(pmPeri,interval(L,M),depth-1,A);
            const bool hasB=refineRootC1(pmPeri,interval(M,U),depth-1,B);
            if(!hasA && !hasB) return false;
            if(hasA && hasB) out=hullMapEval(A,B);
            else out = hasA ? A : B;
            return true;
          }

          // Put A=DP(q), q=(p_*,0), and q1=P(q). Since q1 lies in Fix(S),
          // S(p,z)=(-p,z), reversibility S P S=P^{-1} gives
          // DS DP(q1) DS=A^{-1}. In section coordinates DS=diag(-1,1), and
          // symplecticity gives det A=1 exactly. Thus for A=[[a,b],[c,d]],
          // DP(q1)=[[d,b],[c,a]], and D(P^4)(q)=(DP(q1) A)^2.
          IMatrix evalDF4BySymmetry(IPoincareMap& pmPeri,
                                    const interval& pRoot,
                                    interval& q1Z)
          {
            MapEval Aq;
            if(!refineRootC1(pmPeri,pRoot,12,Aq))
              throw std::runtime_error(
                "evalDF4BySymmetry: no refined C1 cell can contain g=0");

            q1Z=Aq.image[Z];
            const IMatrix& A=Aq.D2;

            cout << "  refined DP(q) = [[" << A[0][0] << ", " << A[0][1]
                 << "],[" << A[1][0] << ", " << A[1][1] << "]]\n";

            IMatrix B(2,2);
            B[0][0]=A[1][1];
            B[0][1]=A[0][1];
            B[1][0]=A[1][0];
            B[1][1]=A[0][0];

            IMatrix BA=mul22(B,A);
            return mul22(BA,BA);
          }'''

          patched = text[:start] + replacement + text[end:]
          if patched == text:
              raise RuntimeError("patch made no change")
          if patched.count("IMatrix evalDF4BySymmetry(") != 1:
              raise RuntimeError("unexpected number of evalDF4BySymmetry definitions")

          path.write_text(patched, encoding="utf-8")
          print("Applied rigorous one-return reversibility patch")
          PY

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libboost-all-dev libgmp-dev libmpfr-dev

      - name: Fetch pinned CAPD source
        run: |
          git clone https://github.com/CAPDGroup/CAPD.git CAPD
          cd CAPD
          git checkout 731079217a9254ea2948d742df2b170895effe7f
          git status --short

      - name: Build CAPD
        run: |
          cmake -S CAPD -B CAPD/build -DCMAKE_BUILD_TYPE=Release
          cmake --build CAPD/build --parallel 2
          test -x CAPD/build/bin/capd-config
          CAPD/build/bin/capd-config --cflags --libs

      - name: Build SI3BP certificate
        run: |
          make CAPD_CONFIG="$PWD/CAPD/build/bin/capd-config"

      - name: Run rigorous certificate
        id: proof
        shell: bash
        run: |
          set +e
          ./si3bp_capd 2>&1 | tee capd-proof.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          set -e

      - name: Upload proof log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: si3bp-capd-proof-log
          path: capd-proof.log
          if-no-files-found: error

      - name: Verify entropy certificate
        shell: bash
        run: |
          grep -F "C1: PASS" capd-proof.log
          grep -F "C4 (Burns--Weiss crossing): PASS" capd-proof.log
          grep -F "ALL ENTROPY CERTIFICATES PASSED." capd-proof.log
          test "${{ steps.proof.outputs.exit_code }}" = "0"
